name: Publish versioned release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/paoloronco/orbitpage
  DOCKERHUB_IMAGE: docker.io/paueron/orbitpage

jobs:
  validate:
    name: Validate tag and release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: version
        name: Validate version metadata and release tag consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(node -p "require('./app/package.json').version")"
          SERVER_VERSION="$(node -p "require('./app/server/package.json').version")"

          if [[ "$VERSION" != "$SERVER_VERSION" ]]; then
            echo "::error::Frontend version ($VERSION) and backend version ($SERVER_VERSION) must match."
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Package version must use X.Y.Z SemVer, got: $VERSION"
            exit 1
          fi

          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${EXPECTED_TAG}."
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::The tagged commit is not contained in origin/main."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${EXPECTED_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Require the complete main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for CHECK_NAME in \
            "Quality Gate" \
            "E2E (chromium)" \
            "E2E (firefox)" \
            "E2E (webkit)" \
            "Publish multi-arch Docker manifest"; do
            CONCLUSION="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${CHECK_NAME}\")] | sort_by(.completed_at) | last | .conclusion // \"missing\"" \
            )"
            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "::error::Required check '${CHECK_NAME}' is ${CONCLUSION}; release stopped."
              exit 1
            fi
          done

  publish-images:
    name: Publish versioned multi-arch manifests
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish versioned multi-arch tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          MAJOR_MINOR="${VERSION%.*}"
          for IMAGE in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${VERSION}" \
              --tag "${IMAGE}:v${VERSION}" \
              --tag "${IMAGE}:${MAJOR_MINOR}" \
              --tag "${IMAGE}:latest" \
              --tag "${IMAGE}:sha-${SHORT_SHA}" \
              "${IMAGE}:build-${GITHUB_SHA}-amd64" \
              "${IMAGE}:build-${GITHUB_SHA}-arm64"
            INSPECTION="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
            printf '%s\n' "$INSPECTION"
            grep -q 'linux/amd64' <<<"$INSPECTION"
            grep -q 'linux/arm64' <<<"$INSPECTION"
          done

  github-release:
    name: Create GitHub release
    needs: [validate, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
