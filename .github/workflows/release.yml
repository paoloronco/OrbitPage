name: Release and container publish

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/paoloronco/orbitpage
  DOCKERHUB_IMAGE: docker.io/paueron/orbitpage

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: version
        name: Validate version metadata and release tag consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(node -p "require('./app/package.json').version")"
          SERVER_VERSION="$(node -p "require('./app/server/package.json').version")"

          if [[ "$VERSION" != "$SERVER_VERSION" ]]; then
            echo "::error::Frontend version ($VERSION) and backend version ($SERVER_VERSION) must match."
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Package version must use X.Y.Z SemVer, got: $VERSION"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXPECTED_TAG="v${VERSION}"

            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${EXPECTED_TAG}."
              exit 1
            fi

            git fetch origin main --no-tags
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::The tagged commit is not contained in origin/main."
              exit 1
            fi

            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "tag=${EXPECTED_TAG}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=" >> "${GITHUB_OUTPUT}"

  smoke-test:
    name: Smoke test image build
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image for smoke test
        run: docker build -t orbitpage-release-smoke .

      - name: Smoke test container health
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm -f orbitpage-release-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name orbitpage-release-smoke \
            -p 3001:8080 \
            -e JWT_SECRET=release-smoke-secret-release-smoke-123456 \
            orbitpage-release-smoke
          for attempt in {1..45}; do
            if curl --fail http://127.0.0.1:3001/health --silent --show-error >/dev/null; then
              echo "Docker health check passed on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done
          docker logs orbitpage-release-smoke
          exit 1

  publish-images:
    name: Publish Docker images
    if: ${{ github.event_name != 'pull_request' }}
    needs: [validate, smoke-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve GHCR metadata
        id: ghcr_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ghcr_meta.outputs.tags }}
          labels: ${{ steps.ghcr_meta.outputs.labels }}
          build-args: |
            NODE_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker Hub metadata
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        id: dockerhub_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern=v{{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker Hub image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.dockerhub_meta.outputs.tags }}
          labels: ${{ steps.dockerhub_meta.outputs.labels }}
          build-args: |
            NODE_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [validate, smoke-test, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
