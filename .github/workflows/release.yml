name: Publish versioned release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish (for example v4.21.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/paoloronco/orbitpage
  DOCKERHUB_IMAGE: docker.io/paoloronco/orbitpage
  LEGACY_DOCKERHUB_IMAGE: docker.io/paueron/orbitpage
  LEGACY_DOCKERHUB_CUTOFF: "2026-10-09T00:00:00Z"

jobs:
  validate:
    name: Validate tag and release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      legacy_enabled: ${{ steps.legacy.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: version
        name: Validate version metadata and release tag consistency
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(node -p "require('./app/package.json').version")"
          SERVER_VERSION="$(node -p "require('./app/server/package.json').version")"

          if [[ "$VERSION" != "$SERVER_VERSION" ]]; then
            echo "::error::Frontend version ($VERSION) and backend version ($SERVER_VERSION) must match."
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Package version must use X.Y.Z SemVer, got: $VERSION"
            exit 1
          fi

          EXPECTED_TAG="v${VERSION}"
          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package version ${EXPECTED_TAG}."
            exit 1
          fi

          git fetch origin main --no-tags
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "::error::The tagged commit is not contained in origin/main."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${EXPECTED_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Require the complete main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          for CHECK_NAME in \
            "Quality Gate" \
            "E2E (chromium)" \
            "E2E (firefox)" \
            "E2E (webkit)" \
            "Build and smoke Docker (amd64)" \
            "Build and smoke Docker (arm64)"; do
            CONCLUSION="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${CHECK_NAME}\")] | sort_by(.completed_at) | last | .conclusion // \"missing\"" \
            )"
            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "::error::Required check '${CHECK_NAME}' is ${CONCLUSION}; release stopped."
              exit 1
            fi
          done

      - id: legacy
        name: Check legacy Docker Hub compatibility window
        env:
          LEGACY_USERNAME: ${{ secrets.LEGACY_DOCKERHUB_USERNAME }}
          LEGACY_TOKEN: ${{ secrets.LEGACY_DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if (( $(date -u +%s) >= $(date -u -d "$LEGACY_DOCKERHUB_CUTOFF" +%s) )); then
            echo "::notice::Legacy Docker Hub updates ended at ${LEGACY_DOCKERHUB_CUTOFF}."
          elif [[ -z "$LEGACY_USERNAME" || -z "$LEGACY_TOKEN" ]]; then
            echo "::warning::Legacy Docker Hub credentials are unavailable; paueron/orbitpage was not updated."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  publish-images:
    name: Publish versioned multi-arch manifests
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish stable multi-arch images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.validate.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ needs.validate.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Verify stable multi-arch images
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for IMAGE in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            INSPECTION="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
            printf '%s\n' "$INSPECTION"
            grep -q 'linux/amd64' <<<"$INSPECTION"
            grep -q 'linux/arm64' <<<"$INSPECTION"
          done

      - name: Log out from primary Docker Hub account
        if: ${{ needs.validate.outputs.legacy_enabled == 'true' }}
        run: docker logout docker.io

      - name: Log in to legacy Docker Hub account
        if: ${{ needs.validate.outputs.legacy_enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.LEGACY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LEGACY_DOCKERHUB_TOKEN }}

      - name: Build and publish legacy stable multi-arch image
        if: ${{ needs.validate.outputs.legacy_enabled == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ORBITPAGE_DISTRIBUTION_IMAGE=docker.io/paueron/orbitpage
          tags: |
            ${{ env.LEGACY_DOCKERHUB_IMAGE }}:${{ needs.validate.outputs.version }}
            ${{ env.LEGACY_DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha,scope=release

  github-release:
    name: Create GitHub release
    needs: [validate, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
