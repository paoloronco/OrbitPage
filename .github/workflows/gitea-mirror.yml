name: Mirror to Gitea

on:
  push:
    branches: [main]
  delete:
  workflow_run:
    workflows: ["Publish versioned release"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GITEA_TOKEN must exist ONLY here, with deployment branches restricted to
    # main. A repository-scoped copy is accessible to branch-authored workflows.
    environment: gitea-mirror
    steps:
      - name: Fetch refs as data without executing repository code
        run: git -c core.hooksPath=/dev/null clone --bare https://github.com/paoloronco/OrbitPage.git mirror.git

      - name: Synchronize branches and tags
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITEA_TOKEN"
          askpass="$RUNNER_TEMP/gitea-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'paoloronco' ;;
            *Password*) printf '%s\n' "$GITEA_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          for attempt in 1 2 3; do
            if git -C mirror.git -c core.hooksPath=/dev/null -c credential.helper= push --prune --force https://gitea.com/paoloronco/OrbitPage.git '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; then
              exit 0
            fi
            sleep "$((attempt * 10))"
          done
          exit 1
