name: Mirror to Gitea

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  delete:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  mirror:
    # GitHub withholds Actions secrets from Dependabot-triggered runs. Those
    # temporary branches do not need mirroring; their merged changes are
    # mirrored by the subsequent push to the target branch.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push mirror to Gitea
        if: github.event_name == 'push'
        run: |
          git remote add gitea https://paoloronco:${{ secrets.GITEA_TOKEN }}@gitea.com/paoloronco/OrbitPage.git
          for attempt in 1 2 3; do
            if git push gitea "${GITHUB_REF}:${GITHUB_REF}"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Gitea mirror attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "Gitea mirror failed after 3 attempts."
          exit 1

      - name: Delete mirrored branch from Gitea
        if: github.event_name == 'delete'
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          git remote add gitea https://paoloronco:${{ secrets.GITEA_TOKEN }}@gitea.com/paoloronco/OrbitPage.git
          if git ls-remote --exit-code --heads gitea "refs/heads/${DELETED_BRANCH}" >/dev/null; then
            git push gitea --delete "refs/heads/${DELETED_BRANCH}"
          else
            echo "Branch ${DELETED_BRANCH} is already absent from Gitea."
          fi
