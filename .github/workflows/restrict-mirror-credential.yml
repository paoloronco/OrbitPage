name: Restrict mirror credential

on:
  workflow_dispatch:

permissions: {}

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    environment: gitea-mirror
    runs-on: ubuntu-latest
    steps:
      # One-time migration. The fixed recipient is this repository environment's
      # GitHub public key. No plaintext is logged or returned to an operator.
      - name: Seal the existing credential to the main-only environment
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, ctypes, ctypes.util, os
          public_key = base64.b64decode("WEi2Hok8sXLHdEOo2bPVeqfKGt4e50v7wMpcRrmzvXk=")
          secret = os.environ["GITEA_TOKEN"].encode()
          if not secret:
              raise RuntimeError("Mirror credential is missing.")
          library = ctypes.util.find_library("sodium")
          if not library:
              raise RuntimeError("Sealed-box encryption is unavailable.")
          sodium = ctypes.cdll.LoadLibrary(library)
          if sodium.sodium_init() < 0:
              raise RuntimeError("Encryption initialization failed.")
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          output = ctypes.create_string_buffer(len(secret) + 48)
          if sodium.crypto_box_seal(output, secret, len(secret), public_key) != 0:
              raise RuntimeError("Credential sealing failed.")
          print("sealed=" + base64.b64encode(output.raw).decode())
          PY
