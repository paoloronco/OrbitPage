name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: docker.io/paoloronco/orbitpage
  LEGACY_DOCKERHUB_IMAGE: docker.io/paueron/orbitpage
  LEGACY_DOCKERHUB_CUTOFF: "2026-10-09T00:00:00Z"
  GHCR_IMAGE: ghcr.io/paoloronco/orbitpage

jobs:
  test:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Markdown links
        working-directory: .
        run: node scripts/check-markdown-links.mjs

      - name: Validate one-command installer
        working-directory: .
        run: |
          bash -n install.sh
          bash -n install-pve.sh
          bash -n scripts/test-installer.sh
          bash -n scripts/test-pve-installer.sh
          shellcheck install.sh install-pve.sh scripts/test-installer.sh scripts/test-pve-installer.sh
          sudo bash scripts/test-installer.sh
          sudo bash scripts/test-pve-installer.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            app/server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install backend dependencies
        run: npm --prefix server ci --prefer-offline --no-audit

      - name: Audit frontend dependencies
        run: |
          npm audit --audit-level=high --json > npm-audit.json || true
          # OrbitPage uses React Router as a client-only SPA, without RSC action
          # endpoints. Remove this narrow exception once npm publishes a version
          # that resolves GHSA-qwww-vcr4-c8h2 without reopening older advisories.
          node ../.github/scripts/check-npm-audit.mjs \
            npm-audit.json \
            GHSA-qwww-vcr4-c8h2

      - name: Audit backend dependencies
        run: npm --prefix server audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend application
        run: npm run build

      - name: Run unit and integration tests (Vitest)
        run: npm run test:unit

      - name: Build Docker image for smoke test
        run: docker build -t orbitpage-ci-smoke ..

      - name: Smoke test Docker image
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm -f orbitpage-ci-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name orbitpage-ci-smoke \
            -p 3001:8080 \
            -e JWT_SECRET=ci-smoke-secret-ci-smoke-secret-123456 \
            orbitpage-ci-smoke
          for attempt in {1..45}; do
            if curl --fail http://127.0.0.1:3001/health --silent --show-error >/dev/null; then
              echo "Docker health check passed on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done
          docker logs orbitpage-ci-smoke
          exit 1

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            app/server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install backend dependencies
        run: npm --prefix server ci --prefer-offline --no-audit

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run isolated Playwright E2E tests
        run: npm run test:e2e:${{ matrix.browser }}
        timeout-minutes: 16

      - name: Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: app/playwright-report/
          retention-days: 30
        continue-on-error: true

  publish-platform-images:
    name: Build and smoke Docker (${{ matrix.arch }})
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [test, e2e]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
            ${{ env.GHCR_IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=rolling-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rolling-${{ matrix.arch }}

      - name: Smoke test published architecture image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="${DOCKERHUB_IMAGE}:build-${GITHUB_SHA}-${{ matrix.arch }}"
          cleanup() {
            docker rm -f orbitpage-${{ matrix.arch }}-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --pull=always --name orbitpage-${{ matrix.arch }}-smoke \
            -p 3001:8080 \
            -e JWT_SECRET=ci-smoke-secret-ci-smoke-secret-123456 \
            "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          for attempt in {1..45}; do
            if curl --fail http://127.0.0.1:3001/health --silent --show-error >/dev/null; then
              echo "Docker health check passed on ${{ matrix.platform }} (attempt ${attempt})."
              exit 0
            fi
            sleep 1
          done
          docker logs orbitpage-${{ matrix.arch }}-smoke
          exit 1

      - id: legacy
        name: Check legacy Docker Hub compatibility window
        env:
          LEGACY_USERNAME: ${{ secrets.LEGACY_DOCKERHUB_USERNAME }}
          LEGACY_TOKEN: ${{ secrets.LEGACY_DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if (( $(date -u +%s) >= $(date -u -d "$LEGACY_DOCKERHUB_CUTOFF" +%s) )); then
            echo "::notice::Legacy Docker Hub updates ended at ${LEGACY_DOCKERHUB_CUTOFF}."
          elif [[ -z "$LEGACY_USERNAME" || -z "$LEGACY_TOKEN" ]]; then
            echo "::warning::Legacy Docker Hub credentials are unavailable; paueron/orbitpage was not updated."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log out from primary Docker Hub account
        if: ${{ steps.legacy.outputs.enabled == 'true' }}
        run: docker logout docker.io

      - name: Log in to legacy Docker Hub account
        if: ${{ steps.legacy.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.LEGACY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LEGACY_DOCKERHUB_TOKEN }}

      - name: Build legacy compatibility image
        if: ${{ steps.legacy.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ORBITPAGE_DISTRIBUTION_IMAGE=docker.io/paueron/orbitpage
          tags: ${{ env.LEGACY_DOCKERHUB_IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=rolling-${{ matrix.arch }}

  publish-images:
    name: Publish multi-arch Docker manifest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: publish-platform-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish rolling multi-arch tags
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          for IMAGE in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              --tag "${IMAGE}:main" \
              --tag "${IMAGE}:sha-${SHORT_SHA}" \
              "${IMAGE}:build-${GITHUB_SHA}-amd64" \
              "${IMAGE}:build-${GITHUB_SHA}-arm64"
            INSPECTION="$(docker buildx imagetools inspect "${IMAGE}:latest")"
            printf '%s\n' "$INSPECTION"
            grep -q 'linux/amd64' <<<"$INSPECTION"
            grep -q 'linux/arm64' <<<"$INSPECTION"
          done

      - id: legacy
        name: Check legacy Docker Hub compatibility window
        env:
          LEGACY_USERNAME: ${{ secrets.LEGACY_DOCKERHUB_USERNAME }}
          LEGACY_TOKEN: ${{ secrets.LEGACY_DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if (( $(date -u +%s) >= $(date -u -d "$LEGACY_DOCKERHUB_CUTOFF" +%s) )); then
            echo "::notice::Legacy Docker Hub updates ended at ${LEGACY_DOCKERHUB_CUTOFF}."
          elif [[ -z "$LEGACY_USERNAME" || -z "$LEGACY_TOKEN" ]]; then
            echo "::warning::Legacy Docker Hub credentials are unavailable; paueron/orbitpage was not updated."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log out from primary Docker Hub account
        if: ${{ steps.legacy.outputs.enabled == 'true' }}
        run: docker logout docker.io

      - name: Log in to legacy Docker Hub account
        if: ${{ steps.legacy.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.LEGACY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.LEGACY_DOCKERHUB_TOKEN }}

      - name: Publish legacy rolling tags
        if: ${{ steps.legacy.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            --tag "${LEGACY_DOCKERHUB_IMAGE}:latest" \
            --tag "${LEGACY_DOCKERHUB_IMAGE}:main" \
            --tag "${LEGACY_DOCKERHUB_IMAGE}:sha-${SHORT_SHA}" \
            "${LEGACY_DOCKERHUB_IMAGE}:build-${GITHUB_SHA}-amd64" \
            "${LEGACY_DOCKERHUB_IMAGE}:build-${GITHUB_SHA}-arm64"
          INSPECTION="$(docker buildx imagetools inspect "${LEGACY_DOCKERHUB_IMAGE}:latest")"
          printf '%s\n' "$INSPECTION"
          grep -q 'linux/amd64' <<<"$INSPECTION"
          grep -q 'linux/arm64' <<<"$INSPECTION"
